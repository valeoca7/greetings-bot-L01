AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Greetings bot webhook

Parameters:
  TelegramBotToken:
    Type: String
    NoEcho: true

Resources:
  DataTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE

  WebhookFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: greetings_bot.lambda_handler.handle_event
      Runtime: python3.9
      Timeout: 10
      MemorySize: 128
      Environment:
        Variables:
          TELEGRAM_BOT_TOKEN: !Ref TelegramBotToken
          USER_TABLE_NAME: !Ref DataTable
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:Scan
              Resource: !GetAtt DataTable.Arn
      Events:
        Webhook:
          Type: Api
          Properties:
            Path: /telegram/webhook
            Method: post

  GreetingDispatcherFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: greetings_bot.scheduled_handler.handle_event
      Runtime: python3.9
      Timeout: 30
      MemorySize: 128
      Environment:
        Variables:
          USER_TABLE_NAME: !Ref DataTable
          DISPATCH_BATCH_SIZE: '100'
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:Scan
              Resource: !GetAtt DataTable.Arn
