AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Greetings bot webhook

Parameters:
  TelegramBotToken:
    Type: String
    NoEcho: true
  BedrockModelId:
    Type: String
    Default: amazon.titan-text-lite-v1
  InformationRequestsEnabled:
    Type: String
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'
  InformationWeeklyLimit:
    Type: Number
    Default: 5
    MinValue: 1
    MaxValue: 100

Resources:
  DataTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: gsi1pk
          AttributeType: S
        - AttributeName: gsi1sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: DueIndex
          KeySchema:
            - AttributeName: gsi1pk
              KeyType: HASH
            - AttributeName: gsi1sk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  DeliveryDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      SqsManagedSseEnabled: true
      MessageRetentionPeriod: 1209600

  DeliveryQueue:
    Type: AWS::SQS::Queue
    Properties:
      SqsManagedSseEnabled: true
      VisibilityTimeout: 120
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt DeliveryDeadLetterQueue.Arn
        maxReceiveCount: 5

  WebhookFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: greetings_bot.lambda_handler.handle_event
      Runtime: python3.9
      Timeout: 10
      MemorySize: 128
      Environment:
        Variables:
          TELEGRAM_BOT_TOKEN: !Ref TelegramBotToken
          USER_TABLE_NAME: !Ref DataTable
          SCHEDULER_TARGET_ARN: !GetAtt ReminderDeliveryFunction.Arn
          SCHEDULER_ROLE_ARN: !GetAtt SchedulerInvokeRole.Arn
          SCHEDULER_GROUP: !Ref ReminderScheduleGroup
          WEATHER_TIMEOUT_SECONDS: '5'
          WEATHER_MAX_CALLS: '20'
          WEATHER_CACHE_MINUTES: '60'
          WEATHER_STALE_HOURS: '24'
          INFO_REQUESTS_ENABLED: !Ref InformationRequestsEnabled
          INFO_WEEKLY_LIMIT: !Ref InformationWeeklyLimit
          BEDROCK_MODEL_ID: !Ref BedrockModelId
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:Scan
                - dynamodb:Query
                - dynamodb:DeleteItem
                - dynamodb:UpdateItem
                - scheduler:CreateSchedule
                - scheduler:UpdateSchedule
                - scheduler:DeleteSchedule
              Resource:
                - !GetAtt DataTable.Arn
                - !Sub '${DataTable.Arn}/index/*'
                - !Sub 'arn:${AWS::Partition}:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/${ReminderScheduleGroup}/*'
            - Effect: Allow
              Action: iam:PassRole
              Resource: !GetAtt SchedulerInvokeRole.Arn
            - Effect: Allow
              Action: bedrock:InvokeModel
              Resource: !Sub 'arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/${BedrockModelId}'
      Events:
        Webhook:
          Type: Api
          Properties:
            Path: /telegram/webhook
            Method: post

  GreetingDispatcherFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: greetings_bot.scheduled_handler.handle_event
      Runtime: python3.9
      Timeout: 30
      MemorySize: 128
      Environment:
        Variables:
          USER_TABLE_NAME: !Ref DataTable
          DISPATCH_BATCH_SIZE: '100'
          TARGETED_REMINDERS: 'true'
          DELIVERY_QUEUE_URL: !Ref DeliveryQueue
          WEATHER_TIMEOUT_SECONDS: '5'
          WEATHER_MAX_CALLS: '20'
          WEATHER_CACHE_MINUTES: '60'
          WEATHER_STALE_HOURS: '24'
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:Scan
                - sqs:SendMessage
              Resource:
                - !GetAtt DataTable.Arn
                - !Sub '${DataTable.Arn}/index/*'
                - !GetAtt DeliveryQueue.Arn
      Events:
        EveryMinute:
          Type: Schedule
          Properties:
            Schedule: rate(1 minute)
            Enabled: true

  ReminderDeliveryFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: greetings_bot.reminder_handler.handle_event
      Runtime: python3.9
      Timeout: 10
      MemorySize: 128
      Environment:
        Variables:
          USER_TABLE_NAME: !Ref DataTable
          DELIVERY_QUEUE_URL: !Ref DeliveryQueue
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - sqs:SendMessage
              Resource:
                - !GetAtt DataTable.Arn
                - !GetAtt DeliveryQueue.Arn

  ReminderScheduleGroup:
    Type: AWS::Scheduler::ScheduleGroup
    Properties:
      Name: !Sub '${AWS::StackName}-reminders'

  SchedulerInvokeRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: invoke-reminder-delivery
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt ReminderDeliveryFunction.Arn

  DeliveryWorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: greetings_bot.queue_worker.handle_event
      Runtime: python3.9
      Timeout: 20
      MemorySize: 128
      Environment:
        Variables:
          TELEGRAM_BOT_TOKEN: !Ref TelegramBotToken
          USER_TABLE_NAME: !Ref DataTable
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
              Resource: !GetAtt DataTable.Arn
      Events:
        DeliveryMessages:
          Type: SQS
          Properties:
            Queue: !GetAtt DeliveryQueue.Arn
            BatchSize: 10
            FunctionResponseTypes:
              - ReportBatchItemFailures

  DeliveryFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Delivery attempts returned for retry
      Namespace: GreetingsBot
      MetricName: Failed
      Dimensions:
        - Name: Service
          Value: delivery
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  DeadLetterQueueAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Messages are waiting in the delivery dead-letter queue
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt DeliveryDeadLetterQueue.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  DeliveryWorkerErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Delivery worker invocation failed
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref DeliveryWorkerFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  WeatherProviderErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Weather provider calls are failing
      Namespace: GreetingsBot
      MetricName: ProviderError
      Dimensions:
        - Name: Service
          Value: weather
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
