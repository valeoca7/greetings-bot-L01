AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Greetings bot webhook

Resources:
  WebhookFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: greetings_bot.lambda_handler.handle_event
      Runtime: python3.9
      Timeout: 10
      MemorySize: 128
