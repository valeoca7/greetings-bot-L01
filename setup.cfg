[metadata]
name = greetings-bot
version = 0.34.0
description = A small Telegram bot for personal greetings
long_description = file: README.md
long_description_content_type = text/markdown
author = valeoca
author_email = valeoca@laptop.local
classifiers =
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.9

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.9

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    greetings-bot = greetings_bot.cli:main
